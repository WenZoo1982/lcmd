[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lcmd"
dynamic = ["version"]
description = "简体中文命令行速查与学习工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15,<1",
    "rich>=13.9,<16",
    "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
lcmd = "lcmd.main:main"

[tool.setuptools.dynamic]
version = {attr = "lcmd.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["LCMD-DEV.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
